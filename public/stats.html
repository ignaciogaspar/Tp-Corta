<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: estadísticas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Estadísticas</h1>
    <p class="sub">Consultá los números de un link corto</p>

    <form id="form-stats">
      <input type="text" id="codigo" placeholder="ej: a3k" required>
      <button type="submit">Buscar</button>
    </form>

    <div class="stats">
      <div class="stat"><span id="clicks" class="numero">-</span><span class="etiqueta">clicks</span></div>
      <div class="stat"><span id="url-original" class="numero">-</span><span class="etiqueta">URL original</span></div>
      <div class="stat"><span id="fecha-creado" class="numero">-</span><span class="etiqueta">creado el</span></div>
    </div>

    <p class="pie"><a href="index.html">Volver a acortar</a></p>
  </main>

  <script>
    const form = document.getElementById('form-stats');
    const clicks = document.getElementById('clicks');
    const urlOriginal = document.getElementById('url-original');
    const fechaCreado = document.getElementById('fecha-creado');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const codigo = document.getElementById('codigo').value.trim();

      try {
        const response = await fetch(`/api/links/${codigo}/stats`);
        if (!response.ok) {
          throw new Error('No se encontró ese código');
        }

        const data = await response.json();
        clicks.textContent = data.clicks;
        urlOriginal.textContent = data.url;
        fechaCreado.textContent = new Date(data.creado).toLocaleString();
      } catch (error) {
        clicks.textContent = '-';
        urlOriginal.textContent = 'No encontrado';
        fechaCreado.textContent = '-';
      }
    });
  </script>
</body>
</html>
